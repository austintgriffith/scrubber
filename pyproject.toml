[project]
name = "scrubber"
version = "0.1.0"
description = "Scrub PII locally (regex + Ollama) before sending prompts to Claude, then restore it in the reply."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = [
    "anthropic",
    "atif-scan>=0.8.15",
]

[project.scripts]
scrub = "scrubber.cli:main"
scrub-chat = "scrubber.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
