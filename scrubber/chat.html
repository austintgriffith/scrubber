<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrub Chat</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e3e3de; --me: #1d4ed8; --me-text: #ffffff; --saw: #f1efe8; --accent: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94;
            --line: #33332f; --me: #2f5fd8; --me-text: #ffffff; --saw: #2a2925; --accent: #f59e0b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  select, button { font: inherit; color: var(--text); background: var(--bg);
                   border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
  button { cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px;
         max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; }
  .me .bubble { background: var(--me); color: var(--me-text); border-radius: 12px 12px 2px 12px; padding: 8px 12px; }
  .saw { margin-top: 4px; font: 12.5px/1.45 ui-monospace, Menlo, monospace; color: var(--muted);
         background: var(--saw); border-radius: 8px; padding: 6px 10px; }
  .saw b, .raw b { font-family: -apple-system, sans-serif; font-weight: 600; color: var(--accent); }
  .bot .bubble { background: var(--panel); border: 1px solid var(--line);
                 border-radius: 12px 12px 12px 2px; padding: 8px 12px; }
  .raw { display: none; margin-top: 4px; font: 12.5px/1.45 ui-monospace, Menlo, monospace;
         color: var(--muted); background: var(--saw); border-radius: 8px; padding: 6px 10px; }
  .bot.open .raw { display: block; }
  .toggle { font-size: 12px; color: var(--muted); background: none; border: none; padding: 2px 0; }
  .err .bubble { border-color: #dc2626; color: #dc2626; }
  .wait { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line);
         background: var(--panel); max-width: 820px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
             border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; max-height: 200px; }
  form button { background: var(--me); color: var(--me-text); border: none; padding: 0 16px; }
  .empty { margin: auto; color: var(--muted); text-align: center; max-width: 420px; }
</style>
</head>
<body>
<header>
  <h1>Scrub Chat</h1>
  <label>Scrubber <select id="profile"></select></label>
  <button id="new" type="button">New chat</button>
</header>
<div id="log"><p class="empty">Type normally. Private info is removed on this machine before Claude sees it. Under each message you can see exactly what was sent.</p></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Message (Enter to send, Shift+Enter for new line)"></textarea>
  <button>Send</button>
</form>
<script>
  const log = document.getElementById('log'), t = document.getElementById('t'),
        f = document.getElementById('f'), sel = document.getElementById('profile');
  let chat = null, busy = false;

  fetch('/profiles').then(r => r.json()).then(d => {
    for (const p of d.profiles) sel.add(new Option(p, p, false, p === d.default));
  });

  function el(cls, parent) { const e = document.createElement('div'); e.className = cls; parent.appendChild(e); return e; }
  function line(parent, label, text) {
    const b = document.createElement('b'); b.textContent = label;
    parent.append(b, document.createTextNode(' ' + text));
  }
  function scroll() { log.scrollTop = log.scrollHeight; }

  document.getElementById('new').onclick = () => { chat = null; log.innerHTML = ''; t.focus(); };
  t.addEventListener('input', () => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; });
  t.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });

  f.onsubmit = async e => {
    e.preventDefault();
    const text = t.value.trim();
    if (!text || busy) return;
    busy = true; t.value = ''; t.style.height = 'auto';
    log.querySelector('.empty')?.remove();

    const me = el('msg me', log); el('bubble', me).textContent = text;
    const saw = el('saw', me); saw.textContent = 'Scrubbing...';
    const bot = el('msg bot', log); const bubble = el('bubble wait', bot); bubble.textContent = 'Waiting...';
    scroll();

    try {
      const r = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat, text, scrubber: sel.value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.statusText);
      chat = d.chat;
      saw.textContent = ''; line(saw, 'Claude saw:', d.sent);
      bubble.className = 'bubble'; bubble.textContent = d.reply;
      const tog = document.createElement('button'); tog.className = 'toggle'; tog.type = 'button';
      tog.textContent = 'show what Claude wrote';
      tog.onclick = () => { bot.classList.toggle('open');
        tog.textContent = bot.classList.contains('open') ? 'hide' : 'show what Claude wrote'; };
      bot.appendChild(tog);
      const raw = el('raw', bot); line(raw, 'Claude wrote:', d.raw);
    } catch (err) {
      saw.textContent = 'Not sent.';
      bot.classList.add('err'); bubble.className = 'bubble'; bubble.textContent = 'Error: ' + err.message;
    }
    busy = false; scroll(); t.focus();
  };
  t.focus();
</script>
</body>
</html>
